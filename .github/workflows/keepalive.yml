name: keepalive

# GitHub disables scheduled workflows in a PUBLIC repository after 60 days
# with no repository activity. This commits a one-line timestamp once a month
# so uptime-watchdog.yml is never silently switched off. It uses only the
# built-in GITHUB_TOKEN; no secrets are stored in this repo.

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit a timestamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(cat .keepalive)"
          git push
